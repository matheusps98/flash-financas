name: Gerar APK Android
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
      - name: Instalar dependências e compilar React
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Testar regras financeiras
        run: npm test
      - name: Criar projeto Android e sincronizar
        run: |
          npx cap add android
          npx cap sync android
      - name: Compilar APK debug instalável
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - name: Disponibilizar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: Flash-Financas-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
